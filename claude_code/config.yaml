name: Claude Code
version: "0.2.4"
slug: claude_code
description: Claude direkt in Home Assistant – Automationen und Änderungen per Chat, auch von unterwegs in der Claude App
url: https://github.com/Devilwitha/HAaddons
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Chat-Oberfläche in der HA-Seitenleiste
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: Claude

# Zugriff auf die HA Core REST-API und Supervisor (Config-Check, Restart, Logs)
homeassistant_api: true
hassio_api: true
hassio_role: manager

map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false

options:
  remote_control: true
  session_name: HAOS
  model: ""
  permission_mode: default
schema:
  remote_control: bool
  session_name: str
  model: str?
  permission_mode: list(default|acceptEdits|plan)
