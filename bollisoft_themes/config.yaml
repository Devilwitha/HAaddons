name: BolliSoft Themes
version: "1.0.0"
slug: bollisoft_themes
description: Fertige Designs, ein einfacher Editor für eigene Themes mit Live-Vorschau und animierte Karten fürs Dashboard (von BolliSoft)
url: https://github.com/Devilwitha/HAaddons/tree/main/bollisoft_themes
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto

# Galerie und Editor in der HA-Seitenleiste
ingress: true
ingress_port: 8099
panel_icon: mdi:palette
panel_title: Themes

# Themes nach /config/themes/bollisoft schreiben, Hintergrundbilder nach /config/www/bollisoft-themes,
# bei Bedarf themes: in die configuration.yaml eintragen
map:
  - type: homeassistant_config
    read_only: false
    path: /config

# frontend.reload_themes, frontend.set_theme, geladene Themes abfragen, Neustart nach dem Einrichten
homeassistant_api: true

options: {}
schema: {}
