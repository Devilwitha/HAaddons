name: "Game Remote"
version: "1.0.0"
slug: "switch2_remote_play"
description: "Remote Play für Nintendo Switch 2 mit Low-Latency Video-Stream und Touch-Controller-Overlay über Raspberry Pi 5 (von BolliSoft)"
url: "https://github.com/Devilwitha/HAaddons"
arch:
  - aarch64
  - amd64
  - armv7
startup: "application"
boot: "auto"
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:nintendo-switch"
panel_title: "Game Remote"
options:
  pi_host: "192.168.1.50"
  pi_ws_port: 8765
  pi_video_port: 8766
  stream_mode: "webrtc"
  default_touch_overlay: true
  haptic_feedback: true
schema:
  pi_host: "str"
  pi_ws_port: "port"
  pi_video_port: "port"
  stream_mode: "list(webrtc|mjpeg)"
  default_touch_overlay: "bool"
  haptic_feedback: "bool"
