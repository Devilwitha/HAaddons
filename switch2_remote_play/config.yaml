name: "Game Remote"
version: "1.0.13"
slug: "switch2_remote_play"
description: "Spielkonsole aus der Seitenleiste fernsteuern – Low-Latency Video-Stream, Touch-Gamepad und Controller über Raspberry Pi 5 (von BolliSoft)"
url: "https://github.com/Devilwitha/HAaddons"
arch:
  - aarch64
  - amd64
  - armv7
startup: "application"
boot: "auto"
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:gamepad-variant-outline"
panel_title: "Game Remote"
# Sensoren: per MQTT-Discovery (Gerät) oder über die REST-API von Home Assistant
homeassistant_api: true
services:
  - "mqtt:want"
options:
  pi_host: "192.168.1.50"
  pi_ws_port: 8765
  pi_video_port: 8766
  stream_mode: "webrtc"
  default_touch_overlay: true
  haptic_feedback: true
  use_mqtt: true
schema:
  pi_host: "str"
  pi_ws_port: "port"
  pi_video_port: "port"
  stream_mode: "list(webrtc|jpeg|mjpeg)"
  default_touch_overlay: "bool"
  haptic_feedback: "bool"
  use_mqtt: "bool"
