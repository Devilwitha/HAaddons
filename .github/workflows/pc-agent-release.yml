# Baut die Windows-.exe des HA PC Agent und veröffentlicht sie als GitHub-Release
# "pcagent-v<Version>". Die installierten .exe prüfen stündlich auf neue Releases
# und aktualisieren sich dann selbst (siehe pc_agent/updater.py).
#
# Auslöser: Push nach main, der pc_agent/version.py ändert – oder von Hand
# (Actions → PC Agent Release → Run workflow). Gibt es das Release zur aktuellen
# Version schon, wird nichts gebaut.
name: PC Agent Release

on:
  push:
    branches: [main]
    paths:
      - pc_agent/version.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-agent-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: pc_agent
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        run: |
          $m = Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          $tag = "pcagent-v$ver"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release $tag existiert bereits – nichts zu tun." }

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: .exe bauen
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconsole --onefile `
            --name "HA PC Agent" --icon "$PWD\icon.ico" --add-data "$PWD\icon.ico;." `
            --distpath "$PWD\dist" --workpath "$PWD\build" --specpath "$PWD\build" `
            "$PWD\agent.py"
          if (-not (Test-Path "dist\HA PC Agent.exe")) { throw ".exe wurde nicht erzeugt" }

      - name: Release veröffentlichen
        if: steps.ver.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "dist\HA PC Agent.exe" `
            --title "HA PC Agent ${{ steps.ver.outputs.version }}" `
            --notes "Automatischer Build der Windows-.exe ($env:GITHUB_SHA). Installierte .exe aktualisieren sich innerhalb einer Stunde selbst."
