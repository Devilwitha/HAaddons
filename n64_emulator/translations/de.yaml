configuration:
  rom_folder:
    name: Spiele-Ordner
    description: Ordner mit den N64-ROMs (.z64, .n64, .v64), unter /share oder /media. Spielstände landen in den Unterordnern saves und states.
  use_mqtt:
    name: MQTT verwenden
    description: Sensoren (Wird gespielt, Spielzeit, Sitzungen …) per MQTT als Gerät anlegen, wenn ein MQTT-Broker eingerichtet ist. Sonst über die REST-API.
  idle_minutes:
    name: Automatisch speichern nach (Minuten)
    description: Ohne Eingabe so lange -> Spielstand und Auto-Speicherstand sichern, Spiel pausieren. 0 = aus.
