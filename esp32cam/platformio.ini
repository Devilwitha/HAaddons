; BolliSoft Kamera: Firmware für die ESP32-CAM (AI-Thinker), liefert unter http://<Name>.local/capture ein JPEG.
; Genutzt von WerWarDas und vom Add-on Vorrat. Anleitung: README.md
; WLAN-Zugangsdaten und Name stehen in include/secrets.h (Vorlage: include/secrets.example.h).
;
; Bauen und flashen:        pio run -t upload --upload-port COM41
; Version setzen (macht GitHub Actions): PLATFORMIO_BUILD_FLAGS='-DFW_VERSION=\"1.0.5\"'
; Danach Updates per WLAN:  pio run -e ota -t upload --upload-port <CAM_HOSTNAME>.local

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.2.1

[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_flags = --auth=werwardas  ; = OTA_PASSWORD aus secrets.h
