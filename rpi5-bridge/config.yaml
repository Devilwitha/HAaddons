# Raspberry Pi 5 Bridge für Game Remote
#
# Die installierte, aktive Konfiguration liegt in /etc/switch2-bridge/config.yaml
# (wird beim ersten Installieren aus dieser Datei angelegt und bei Updates nicht überschrieben).
# Nach einer Änderung: sudo systemctl restart switch2-bridge

websocket:
  host: "0.0.0.0"
  port: 8765                  # in Home Assistant: pi_ws_port

video:
  host: "0.0.0.0"
  port: 8766                  # in Home Assistant: pi_video_port
  device: "auto"              # "auto" = erste USB-Capture-Card (findet sie auch unter neuer Nummer),
                              # fester Pfad wie "/dev/v4l/by-id/usb-…-video-index0", "test" = Testbild
  width: 1280
  height: 720
  fps: 60                     # Aufnahme von der Capture-Card
  fourcc: "MJPG"              # USB-2.0-Karten: "MJPG"; echte USB-3.0-Karten: "YUYV" (unkomprimiert, schneller)
  jpeg_quality: 80            # Qualität der Einzelbilder/des MJPEG-Streams (1-100)
  webrtc_fixed_bitrate: true  # feste Datenrate: aiortc legt den Encoder sonst bei jeder Änderung neu an (Hänger)
  webrtc_speed: -12           # VP8-Geschwindigkeit: -12 wie libwebrtc auf ARM (aiortc: -6 = langsamer, schärfer)
  webrtc_codec: "h264"        # h264 (x264, auf dem Pi etwa doppelt so schnell) oder vp8; im Browser umschaltbar
  h264_preset: "superfast"    # x264: ultrafast (schnellste), superfast, veryfast (schärfer, langsamer)
  webrtc_encode_nice: -5      # Priorität beim Kodieren: unter der Bridge (-10), damit Eingaben nie warten
  webrtc_threads: 4           # Kerne für den VP8-Encoder (aiortc nimmt sonst nur 2)
  jpeg_passthrough: true      # liefert die Karte JPEG, Bilder unverändert weitergeben (Pi kodiert nichts)
  capture_buffers: 3          # Bildpuffer der Karte (1 = Bilder gehen verloren, ~40 statt 60 fps)
  nv12: true                  # Karten ohne MJPEG (z. B. Cam Link 4K): NV12 roh lesen, spart Umrechnung
  mjpeg_fps: 30               # Bilder pro Sekunde im MJPEG-Stream
  webrtc_fps: 60              # Bilder pro Sekunde über WebRTC (mehr = weniger Verzögerung; schafft die CPU
                              # weniger, sinkt die Rate von selbst, ohne dass sich Bilder stauen)
  webrtc_max_bitrate: 6000000 # höchste WebRTC-Bitrate in Bit/s
  webrtc_min_bitrate: 3000000 # niedrigste WebRTC-Bitrate (sonst startet das Bild lange unscharf)
                              # Die Bildqualität (720p · 60 fps / 1080p · 30 fps) lässt sich in Game Remote
                              # unter „Messwerte“ umschalten und wird in /var/lib/switch2-bridge gemerkt.

audio:
  device: "auto"              # Ton der Capture-Card (nur über WebRTC): "auto" = erste USB-Soundkarte mit
                              # Eingang, "off" = kein Ton, oder ALSA-Name wie "plughw:CARD=Link4K,DEV=0"
                              # (Liste: arecord -l)

controller:
  enabled: true               # false = Testmodus ohne Bluetooth
  watchdog_seconds: 2.0       # ohne Heartbeat so lange -> alle Tasten loslassen
  input_rate_hz: 120          # Pro Controller erwartet ca. 120 Pakete pro Sekunde
  reconnect_file: "/var/lib/switch2-bridge/switch_addresses.json"

log_level: "INFO"             # DEBUG für mehr Details

system:
  tune: true                  # beim Start Pi auf gleichmäßige Leistung stellen (gilt bis zum Neustart)
  cpu_governor: "performance" # kein Hoch- und Heruntertakten mitten im Bild
  priority: -10               # Vorrang vor anderen Programmen auf dem Pi (nice, -20 bis 19; 0 = aus)
  wifi_power_save_off: true   # WLAN-Stromsparen aus (sonst Aussetzer von 50-200 ms)
