<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>BolliSoft Browser</title>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
      <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M4 20h16"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
      <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 4h6v3H9zM8 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-2M9 12h6m-6 4h4"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M7 6.3a8 8 0 1 0 10 0"/></symbol>
      <symbol id="i-tabs" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></symbol>
      <symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
      <symbol id="i-router" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M8 9a6 6 0 0 1 8 0M5.5 6.5a9.5 9.5 0 0 1 13 0"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="top">
      <div class="tabstrip" id="tabstrip" role="tablist"></div>
      <div class="navbar">
        <button class="ib" id="b-back" title="Zurück (Alt+←)" disabled><svg><use href="#i-back"/></svg></button>
        <button class="ib" id="b-forward" title="Vor (Alt+→)" disabled><svg><use href="#i-forward"/></svg></button>
        <button class="ib" id="b-reload" title="Neu laden (F5)"><svg><use href="#i-reload" id="reload-ic"/></svg></button>
        <button class="ib hide-xs" id="b-home" title="Startseite"><svg><use href="#i-home"/></svg></button>
        <form class="addr" id="addr-form" autocomplete="off">
          <svg class="addr-ic" aria-hidden="true"><use href="#i-search" id="addr-ic"/></svg>
          <input id="addr" type="text" inputmode="url" enterkeyhint="go" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" placeholder="Adresse, IP oder Suchbegriff" aria-label="Adresse">
          <button type="button" class="ib sm" id="b-star" title="Lesezeichen"><svg><use href="#i-star"/></svg></button>
        </form>
        <button class="ib tabs-btn" id="b-tabs" title="Tabs"><span id="tab-count">1</span></button>
        <button class="ib touch-only" id="b-kbd" title="Tastatur"><svg><use href="#i-kbd"/></svg></button>
        <button class="ib" id="b-menu" title="Menü"><svg><use href="#i-dots"/></svg></button>
      </div>
      <div class="progress" id="progress"></div>
    </header>

    <main class="stage" id="stage">
      <canvas id="screen"></canvas>
      <textarea id="kbd" class="kbd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                aria-label="Tastatureingabe"></textarea>

      <section class="start hidden" id="start">
        <div class="start-in">
          <div class="brand">
            <div class="brand-ic"><svg><use href="#i-globe"/></svg></div>
            <div>
              <h1>Browser</h1>
              <p>Geräte und Seiten im Heimnetz – direkt aus Home Assistant geöffnet.</p>
            </div>
          </div>
          <form class="start-search" id="start-form" autocomplete="off">
            <svg aria-hidden="true"><use href="#i-search"/></svg>
            <input id="start-addr" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocorrect="off"
                   spellcheck="false" placeholder="z. B. 192.168.178.1, fritz.box oder ein Suchbegriff">
            <button class="btn primary" type="submit">Öffnen</button>
          </form>

          <div class="sec">
            <div class="sec-h">
              <h2>Lesezeichen</h2>
              <button class="link" id="bm-add" type="button">+ Hinzufügen</button>
            </div>
            <div class="tiles" id="bm-grid"></div>
            <p class="empty hidden" id="bm-empty">Noch keine Lesezeichen. Mit dem Stern in der Adresszeile merkst du dir die
              offene Seite.</p>
          </div>

          <div class="sec" id="dev-sec">
            <div class="sec-h">
              <h2>Geräte aus Home Assistant</h2>
              <input class="filter" id="dev-filter" type="search" placeholder="Filtern" aria-label="Geräte filtern">
            </div>
            <div class="devlist" id="dev-list"></div>
            <p class="empty hidden" id="dev-empty"></p>
          </div>

          <div class="sec hidden" id="recent-sec">
            <div class="sec-h">
              <h2>Zuletzt besucht</h2>
              <button class="link" id="recent-clear" type="button">Leeren</button>
            </div>
            <div class="rows" id="recent-list"></div>
          </div>
        </div>
      </section>

      <div class="overlay hidden" id="overlay">
        <div class="ov-box">
          <div class="spinner" id="ov-spin"></div>
          <p id="ov-text">Verbindung wird hergestellt …</p>
          <p class="ov-detail" id="ov-detail"></p>
          <button class="btn primary hidden" id="ov-btn" type="button">Erneut versuchen</button>
        </div>
      </div>
    </main>
  </div>

  <div class="menu hidden" id="menu" role="menu">
    <button class="mi" data-act="tab_new"><svg><use href="#i-plus"/></svg>Neuer Tab</button>
    <button class="mi" data-act="bookmark"><svg><use href="#i-star"/></svg><span id="mi-bookmark">Lesezeichen setzen</span></button>
    <button class="mi" data-act="text"><svg><use href="#i-paste"/></svg>Text senden …</button>
    <button class="mi" data-act="copy"><svg><use href="#i-copy"/></svg>Markierten Text kopieren</button>
    <button class="mi" data-act="external"><svg><use href="#i-external"/></svg>Seite direkt öffnen</button>
    <div class="msep"></div>
    <div class="mrow">
      <span>Ansicht</span>
      <div class="seg" id="seg-view">
        <button data-v="mobile">Handy</button><button data-v="desktop">Desktop</button>
      </div>
    </div>
    <div class="mrow">
      <span>Zoom</span>
      <div class="seg zoom">
        <button id="zoom-out" title="Kleiner">−</button><button id="zoom-reset" title="Zurücksetzen">100 %</button><button id="zoom-in" title="Größer">+</button>
      </div>
    </div>
    <div class="mrow">
      <span>Bild</span>
      <div class="seg" id="seg-quality">
        <button data-v="fast">Schnell</button><button data-v="normal">Normal</button><button data-v="sharp">Scharf</button>
      </div>
    </div>
    <div class="msep"></div>
    <button class="mi" data-act="downloads"><svg><use href="#i-download"/></svg>Downloads<span class="badge hidden" id="dl-badge"></span></button>
    <button class="mi" data-act="restart"><svg><use href="#i-power"/></svg>Browser neu starten</button>
    <button class="mi danger" data-act="clear"><svg><use href="#i-trash"/></svg>Browserdaten löschen</button>
    <div class="mfoot" id="mfoot"></div>
  </div>

  <div class="sheet hidden" id="sheet">
    <div class="sheet-box">
      <div class="sheet-h"><h3 id="sheet-title"></h3><button class="ib sm" id="sheet-close" title="Schließen"><svg><use href="#i-x"/></svg></button></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="modal hidden" id="modal">
    <form class="modal-box" id="modal-box" autocomplete="off"></form>
  </div>

  <div class="toast hidden" id="toast"></div>
  <input type="file" id="file" hidden>

  <script src="static/app.js"></script>
</body>
</html>
