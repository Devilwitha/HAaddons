configuration:
  start_url:
    name: Start page
    description: >-
      Optional address opened by a new browser and by the home button, e.g. http://192.168.178.1. Empty = built-in
      start page with bookmarks and the devices from Home Assistant.
  ignore_certificate_errors:
    name: Ignore certificate errors
    description: >-
      Devices on the local network (routers, printers, NAS) usually use self-signed certificates. When enabled,
      such HTTPS pages open without a warning.
  idle_minutes:
    name: Pause after (minutes)
    description: >-
      Chromium is stopped when nobody has the browser open for this long, which saves memory. Open tabs come back
      the next time. 0 = keep running.
